<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3038"/><stop offset="1" stop-color="#161a21"/>
    </linearGradient>
    <linearGradient id="cell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e242c"/><stop offset="1" stop-color="#12171f"/>
    </linearGradient>
  </defs>
  <g transform="scale(2)" font-family="Segoe UI, system-ui, sans-serif">

    <!-- world -->
    <rect x="0" y="0" width="800" height="470" fill="#141d16"/>
    <path d="M120 300 L300 190 L470 268 L640 150 L770 235 L770 470 L120 470 Z" fill="#253228"/>
    <polygon points="300,268 315,308 285,308" fill="rgba(102,230,115,0.35)"/>
    <polygon points="620,200 635,240 605,240" fill="rgba(255,82,69,0.3)"/>
    <polygon points="470,150 485,190 455,190" fill="rgba(92,158,254,0.25)"/>

    <!-- selection ring + health bar + group number -->
    <circle cx="300" cy="288" r="42" fill="none" stroke="#66e673" stroke-width="1.5"/>
    <g>
      <rect x="264" y="232" width="72" height="9" fill="#000"/>
      <rect x="265" y="233" width="54" height="7" fill="#66e673"/>
      <rect x="264" y="232" width="72" height="9" fill="none" stroke="#334d33" stroke-width="1"/>
    </g>
    <text x="252" y="241" font-size="11" font-weight="700" fill="#000">1</text>
    <text x="251" y="240" font-size="11" font-weight="700" fill="#dbe5ff">1</text>

    <!-- waypoint route -->
    <g stroke="#4080c0" stroke-width="1.5" fill="none">
      <circle cx="390" cy="240" r="6"/><circle cx="450" cy="200" r="6"/>
      <path d="M300 288 L390 240 L450 200"/>
    </g>

    <!-- drag selection box -->
    <rect x="150" y="200" width="80" height="60" fill="rgba(102,230,115,0.08)" stroke="#66e673" stroke-width="1"/>

    <!-- factory rally point -->
    <circle cx="620" cy="330" r="14" fill="none" stroke="#e6cf3c" stroke-width="1.5"/>
    <circle cx="620" cy="330" r="4" fill="none" stroke="#e6cf3c" stroke-width="1.5"/>
    <path d="M560 350 L620 330" stroke="rgba(230,207,60,0.6)" stroke-width="1"/>
    <text x="629" y="322" font-size="10" fill="#000">Rally point</text>
    <text x="628" y="321" font-size="10" fill="#e6cf3c">Rally point</text>

    <!-- floating text -->
    <text x="520" y="180" font-size="14" font-weight="700" fill="rgba(255,255,255,0.45)">+$600</text>

    <!-- superweapon timer -->
    <text x="12" y="18" font-size="12" font-weight="700" fill="#c99e3c">SUPERWEAPON READY</text>

    <!-- mouseover tooltip -->
    <g>
      <rect x="680" y="180" width="118" height="44" fill="rgba(0,0,0,0.55)"/>
      <text x="686" y="194" font-size="10" fill="#c99e3c">Avatar Stalwart</text>
      <text x="686" y="208" font-size="9" fill="#6b7683">Veterancy level 2</text>
      <text x="686" y="220" font-size="9" fill="#6b7683">90% health</text>
    </g>
    <polygon points="700,166 712,182 704,182 700,186" fill="#dbe5ff"/>

    <!-- ============ radar frame ============ -->
    <rect x="6" y="470" width="180" height="130" fill="url(#frame)"/>
    <rect x="6" y="470" width="180" height="130" fill="none" stroke="#4a525c" stroke-width="1.5"/>
    <line x1="6" y1="470" x2="186" y2="470" stroke="#5c6570" stroke-width="1"/>
    <rect x="12" y="476" width="168" height="118" fill="#0c1218"/>
    <g fill="#2a3a30">
      <rect x="30" y="500" width="24" height="22"/><rect x="86" y="540" width="20" height="18"/>
      <rect x="120" y="486" width="26" height="24"/><rect x="60" y="560" width="18" height="16"/>
    </g>
    <g fill="#0f1720">
      <rect x="150" y="560" width="26" height="28"/><rect x="16" y="480" width="22" height="14"/>
    </g>
    <circle cx="46" cy="530" r="3.5" fill="#66e673"/>
    <circle cx="96" cy="566" r="3.5" fill="#66e673"/>
    <circle cx="130" cy="500" r="3.5" fill="#ff5245"/>
    <circle cx="70" cy="590" r="3.5" fill="#5c9efe"/>
    <rect x="60" y="510" width="56" height="40" fill="none" stroke="rgba(207,214,224,0.5)" stroke-width="1"/>

    <!-- ============ control bar frame ============ -->
    <rect x="190" y="470" width="604" height="130" fill="url(#frame)"/>
    <rect x="190" y="470" width="604" height="130" fill="none" stroke="#4a525c" stroke-width="1.5"/>
    <line x1="190" y1="470" x2="794" y2="470" stroke="#5c6570" stroke-width="1"/>

    <!-- selected unit: portrait, health -->
    <rect x="196" y="476" width="74" height="74" fill="#0b1016" stroke="#6b7683" stroke-width="1"/>
    <polygon points="233,498 252,532 214,532" fill="rgba(92,158,254,0.4)"/>
    <text x="200" y="548" font-size="10" font-weight="700" fill="#c99e3c">AVATAR</text>
    <rect x="196" y="554" width="74" height="7" fill="#000" stroke="#334d33" stroke-width="1"/>
    <rect x="197" y="555" width="52" height="5" fill="#66e673"/>

    <!-- general's experience bar + stars -->
    <rect x="196" y="565" width="74" height="10" fill="#000" stroke="#4a525c" stroke-width="1"/>
    <rect x="197" y="566" width="34" height="8" fill="rgba(201,158,60,0.5)"/>
    <g font-size="9" text-anchor="middle">
      <text x="203" y="588" fill="#c99e3c">★</text><text x="215" y="588" fill="#c99e3c">★</text><text x="227" y="588" fill="#c99e3c">★</text>
      <text x="239" y="588" fill="#3a4149">★</text><text x="251" y="588" fill="#3a4149">★</text><text x="263" y="588" fill="#3a4149">★</text>
    </g>

    <!-- ability panel (RightHUD) -->
    <rect x="274" y="476" width="70" height="124" fill="#0b1016" stroke="#6b7683" stroke-width="1"/>
    <g fill="url(#cell)" stroke="#6b7683" stroke-width="1">
      <rect x="278" y="480" width="62" height="20"/><rect x="278" y="504" width="62" height="20"/>
      <rect x="278" y="528" width="62" height="20"/>
    </g>
    <rect x="278" y="552" width="62" height="20" fill="rgba(201,158,60,0.14)" stroke="rgba(201,158,60,0.5)" stroke-width="1"/>
    <g font-size="9" fill="#cfd6e0">
      <text x="282" y="494">SPRAY</text><text x="282" y="518">HEAL</text><text x="282" y="542">HOLD</text>
      <text x="282" y="566" fill="#c99e3c">LEVEL UP</text>
    </g>

    <!-- command buttons: 2 rows x 7 -->
    <g>
      <!-- row 1 -->
      <g fill="url(#cell)" stroke="#7f9a72" stroke-width="1.2">
        <rect x="350" y="476" width="40" height="40"/><rect x="391" y="476" width="40" height="40"/>
        <rect x="432" y="476" width="40" height="40"/><rect x="514" y="476" width="40" height="40"/>
        <rect x="555" y="476" width="40" height="40"/><rect x="596" y="476" width="40" height="40"/>
      </g>
      <!-- row 2 -->
      <g fill="url(#cell)" stroke="#7f9a72" stroke-width="1.2">
        <rect x="350" y="517" width="40" height="40"/><rect x="391" y="517" width="40" height="40"/>
        <rect x="432" y="517" width="40" height="40"/><rect x="514" y="517" width="40" height="40"/>
        <rect x="555" y="517" width="40" height="40"/><rect x="596" y="517" width="40" height="40"/>
      </g>
      <!-- greyed -->
      <g fill="#141820" stroke="#3a4149" stroke-width="1">
        <rect x="473" y="476" width="40" height="40"/><rect x="473" y="517" width="40" height="40"/>
      </g>
      <!-- hovered, with highlight -->
      <rect x="350" y="476" width="40" height="40" fill="rgba(92,158,254,0.16)" stroke="#cfd6e0" stroke-width="1.5"/>
    </g>
    <g font-size="11" fill="#cfd6e0">
      <text x="354" y="492">⌂</text><text x="395" y="492">⛊</text><text x="436" y="492">⚒</text>
      <text x="518" y="492">◆</text><text x="559" y="492">◇</text><text x="600" y="492">⌗</text>
      <text x="354" y="533">⌞</text><text x="395" y="533">⌈</text><text x="436" y="533">⌋</text>
      <text x="518" y="533">⌇</text><text x="559" y="533">⌏</text><text x="600" y="533">⌌</text>
    </g>
    <g font-size="9" fill="#6b7683">
      <text x="354" y="512">Q</text><text x="395" y="512">W</text><text x="436" y="512">E</text><text x="477" y="512">R</text>
      <text x="518" y="512">T</text><text x="559" y="512">Y</text><text x="600" y="512">U</text>
      <text x="354" y="553">A</text><text x="395" y="553">S</text><text x="436" y="553">D</text><text x="477" y="553">F</text>
      <text x="518" y="553">G</text><text x="559" y="553">H</text><text x="600" y="553">J</text>
    </g>

    <!-- build-up clock on one button, drawn as a smooth sweep -->
    <path d="M411 496 L411 476 A20 20 0 1 1 411 496 Z" fill="rgba(0,0,0,0.5)"/>

    <!-- system buttons row -->
    <g fill="url(#cell)" stroke="#6d86b3" stroke-width="1.2">
      <rect x="350" y="561" width="40" height="34"/><rect x="391" y="561" width="40" height="34"/>
      <rect x="432" y="561" width="40" height="34"/><rect x="473" y="561" width="40" height="34"/>
      <rect x="514" y="561" width="40" height="34"/>
    </g>
    <g font-size="11" fill="#cfd6e0">
      <text x="354" y="582">⚙</text><text x="395" y="582">✉</text><text x="436" y="582">☰</text>
      <text x="477" y="582">⚑</text><text x="518" y="582">★</text>
    </g>

    <!-- money and power -->
    <text x="650" y="492" font-size="14" font-weight="700" fill="#c99e3c">$12,400</text>
    <text x="650" y="512" font-size="10" fill="#6b7683">POWER</text>
    <text x="748" y="512" font-size="11" font-weight="700" fill="#5c9efe" text-anchor="end">+2,400</text>
    <rect x="650" y="516" width="134" height="12" fill="#000" stroke="#4a525c" stroke-width="1"/>
    <rect x="651" y="517" width="88" height="10" fill="rgba(92,158,254,0.8)"/>

    <!-- production queue -->
    <g>
      <rect x="650" y="534" width="134" height="62" fill="#0b1016" stroke="#6b7683" stroke-width="1"/>
      <g fill="rgba(201,158,60,0.12)">
        <rect x="652" y="536" width="94" height="18"/><rect x="652" y="556" width="47" height="18"/>
      </g>
      <g stroke="#3a4149" stroke-width="1" fill="none">
        <rect x="652" y="536" width="130" height="18"/><rect x="652" y="556" width="130" height="18"/><rect x="652" y="576" width="130" height="18"/>
      </g>
      <g font-size="9" fill="#cfd6e0">
        <text x="656" y="549">SUPPLY DEPOT</text><text x="656" y="569">MGLA</text><text x="656" y="589" fill="#6b7683">—</text>
      </g>
    </g>

  </g>
  <text x="16" y="1186" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#7887a8">The same 800×600 control-bar layout at ×2 — nothing about it is redesigned. Positions follow the structure the code lays out (LeftHUD radar, RightHUD panel, MoneyDisplay, PowerWindow, GeneralsExp, ButtonCommand01–14 as 2 rows × 7); the real .wnd data is read from the installed game data, so exact rects are not reproduced. Button border colours come from ControlBarScheme.ini per side — these are illustrative. Text here is a normal font rendered at the size it is shown at, which is the only thing that changes.</text>
</svg>
